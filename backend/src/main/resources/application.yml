spring:
  application:
    name: oxeconnect-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/oxeconnect}
    username: ${DB_USER:oxeconnect}
    password: ${DB_PASSWORD:oxeconnect123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
